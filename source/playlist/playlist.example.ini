[Playlist]
; Music folder relative to this INI, or a full path. No subfolder scanning.
Music=Music
; Prepared-audio cache budget in MiB. Range: 16..65536.
CacheMiB=3072

[Normalization]
; Keep the existing loudness/peak-protection pipeline enabled.
Enabled=1
TargetLUFS=-16
TruePeakDBTP=-1

[Audio]
; Personal ByteBeat voice gain: decimal 0..6 dB. 0 is neutral. Restart required.
; Native personal ByteBeat can inherit the gain.
VoiceGainDb=3.0

[Keyboard]
; Ctrl required; Shift and/or Alt optional. Restart after changes.
; Example: Next=Ctrl+F7 or Next=Ctrl+Alt+F7. Native input is not blocked.
; F1..F24 except F12/Alt+F4. Different function key per action; None disables.
Enabled=1
Previous=Ctrl+Shift+F6
Next=Ctrl+Shift+F7
ToggleShuffle=Ctrl+Shift+F8
ShuffleAndAdvance=Ctrl+Shift+F9

[Notifications]
; Play a sound when toggling shuffle. 0 disables these cues.
ShuffleSounds=1
